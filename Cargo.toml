[package]
name = "keyboard_backlight"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3.1.1"
rand = "0.10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_Foundation",
    "Win32_Security",
] }
